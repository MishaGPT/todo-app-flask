<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список справ</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 15px; background: #f4f6f8; }
        h1 { text-align: center; }
        form.add { display: flex; gap: 8px; margin-bottom: 25px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; flex: 1; }
        button { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; color: #fff; background: #3b82f6; }
        button.del { background: #ef4444; }
        button.ok { background: #22c55e; }
        .task { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px; margin-bottom: 8px; border-radius: 8px; }
        .done .text { text-decoration: line-through; color: #888; }
        .user { font-size: 12px; color: #666; }
        .actions { display: flex; gap: 6px; }
    </style>
</head>
<body>
    <h1>📝 Список справ</h1>

    <form class="add" action="/add" method="post">
        <input type="text" name="user_name" placeholder="Ваше ім'я" required>
        <input type="text" name="title" placeholder="Нове завдання" required>
        <button type="submit">Додати</button>
    </form>

    {% for t in tasks %}
    <div class="task {{ 'done' if t.done }}">
        <div>
            <div class="text">{{ t.title }}</div>
            <div class="user">👤 {{ t.user_name }} · {{ t.created_at.strftime('%d.%m.%Y %H:%M') }}</div>
        </div>
        <div class="actions">
            {% if not t.done %}
            <form action="/done/{{ t._id }}" method="post"><button class="ok">✔</button></form>
            {% endif %}
            <form action="/delete/{{ t._id }}" method="post"><button class="del">✖</button></form>
        </div>
    </div>
    {% else %}
    <p style="text-align:center;color:#888;">Завдань поки немає</p>
    {% endfor %}
</body>
</html>
